info:
  contact: {}
  description: Go port of the fleet-management backend (auth, companies, uploads).
  title: Fleet API
  version: "1.0"
paths:
  /api/v1/asset-statuses:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssetStatusPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List asset statuses
      tags:
      - asset-statuses
    post:
      consumes:
      - application/json
      parameters:
      - description: Asset status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssetStatusRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AssetStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an asset status
      tags:
      - asset-statuses
  /api/v1/asset-statuses/{id}:
    delete:
      parameters:
      - description: Asset status id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an asset status
      tags:
      - asset-statuses
    get:
      parameters:
      - description: Asset status id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssetStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an asset status
      tags:
      - asset-statuses
    put:
      consumes:
      - application/json
      parameters:
      - description: Asset status id
        in: path
        name: id
        required: true
        type: integer
      - description: Asset status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAssetStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssetStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an asset status
      tags:
      - asset-statuses
  /api/v1/asset-trailer-assignments:
    get:
      description: Answers "what is towing this trailer?" without draining every asset's
        nested assignments. A partial unique index allows at most one active assignment
        per trailer, so trailer_id with is_active=true identifies the current one
        unambiguously.
      parameters:
      - description: Filter by trailer
        in: query
        name: trailer_id
        type: integer
      - description: Filter by towing asset
        in: query
        name: asset_id
        type: integer
      - description: Filter by active state
        in: query
        name: is_active
        type: boolean
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssetTrailerAssignmentPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List trailer assignments across the fleet
      tags:
      - asset-trailer-assignments
  /api/v1/asset-types:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssetTypePage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List asset types
      tags:
      - asset-types
    post:
      consumes:
      - application/json
      parameters:
      - description: Asset type
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssetTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AssetTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an asset type
      tags:
      - asset-types
  /api/v1/asset-types/{id}:
    delete:
      parameters:
      - description: Asset type id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an asset type
      tags:
      - asset-types
    get:
      parameters:
