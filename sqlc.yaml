version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the golang-migrate schema and ignores *.down.sql automatically.
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        # Nullable columns -> *T, matching the hand-written domain structs.
        emit_pointers_for_null_types: true
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          # numeric maps to the same shopspring/decimal used across internal/domain.
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          # Temporal columns as time.Time / *time.Time, matching the domain structs
          # (pgx scans timestamptz/date into these directly).
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
