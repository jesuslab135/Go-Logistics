name: Deploy QA

# The QA twin of deploy.yml: push to `qa` and the same pipeline rolls a fully
# separate stack — /opt/fleet-qa on the same VPS, its own database, MinIO and
# secrets — served at https://qa-go-logistics.jesuslab135.com. Production is
# untouched: different compose project, different edge aliases, different image
# tags (qa-<sha> and :qa, never :latest). See deploy/README.md, "QA".
on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jesuslab135/go-logistics
  DEPLOY_DIR: /opt/fleet-qa

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:qa-${{ github.sha }}
            ${{ env.IMAGE }}:qa
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # The qa environment overrides the API_DOMAIN variable; the SSH secrets are
    # repository-level and shared with production (same host, same user).
    environment: qa
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ship the deploy bundle
        # Everything the server needs EXCEPT .env, which is server-owned.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          # shellcheck disable=SC2029  # the path must expand here, on the runner
          ssh "$HOST" "mkdir -p $DEPLOY_DIR/migrations"
          scp deploy/docker-compose.prod.yml "$HOST:$DEPLOY_DIR/docker-compose.yml"
          scp deploy/deploy.sh "$HOST:$DEPLOY_DIR/"
          scp internal/db/migrations/* "$HOST:$DEPLOY_DIR/migrations/"

      - name: Roll the stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          # shellcheck disable=SC2029  # the username must expand here, on the runner
          printf '%s' "$GHCR_PULL_TOKEN" \
            | ssh "$HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          IMAGE_REF="${IMAGE}:qa-${GITHUB_SHA}"
          # shellcheck disable=SC2029  # the ref must expand here, on the runner
          ssh "$HOST" "chmod +x $DEPLOY_DIR/deploy.sh \
            && $DEPLOY_DIR/deploy.sh '$IMAGE_REF'"

      - name: Health gate
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${API_DOMAIN}/healthz" >/dev/null 2>&1; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "QA API never became healthy — check: ssh deploy@<host> 'cd ${DEPLOY_DIR} && docker compose logs api migrate'"
          exit 1
