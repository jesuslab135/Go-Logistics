# Go-Logistics QA edge vhost — the versioned copy of what runs on the VPS.
#
# Same arrangement as go-logistics.conf: these blocks live INSIDE
# /opt/sga/nginx/app.conf, between the markers
#
#   # >>> BEGIN go-logistics-qa (managed: deploy/nginx/go-logistics-qa.conf) >>>
#   ...
#   # <<< END go-logistics-qa <<<
#
# and route to the QA stack's edge aliases (EDGE_ALIAS=fleet-qa), never to
# fleet-api / fleet-minio.
#
# No limit_req here on purpose: limit_req_zone names are global to the http
# block, and redefining the production zones would stop nginx from starting.
#
# app.conf is a single-file bind mount: write it IN PLACE (cat tmp > app.conf),
# never with sed -i or an editor that swaps the inode, or the container keeps
# reading the old file. Then
#   docker exec sga_nginx nginx -t && docker exec sga_nginx nginx -s reload

server {
    listen 80;
    server_name qa-go-logistics.jesuslab135.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name qa-go-logistics.jesuslab135.com;

    ssl_certificate     /etc/letsencrypt/live/qa-go-logistics.jesuslab135.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa-go-logistics.jesuslab135.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 8M;

    # Per-request resolution so a redeploy (new container IP) never 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /fleet/ {
        set $fleet_qa_minio fleet-qa-minio:9000;
        proxy_pass http://$fleet_qa_minio$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Host passes through unchanged: SigV4 signs it (see go-logistics.conf).
    location /fleet-private/ {
        set $fleet_qa_private_minio fleet-qa-minio:9000;
        proxy_pass http://$fleet_qa_private_minio$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $fleet_qa_api fleet-qa-api:8080;
        proxy_pass http://$fleet_qa_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
