# Go-Logistics edge vhost — the versioned copy of what runs on the VPS.
#
# The VPS already served an unrelated site before this one, and its nginx
# (project `sga`, /opt/sga) owns ports 80/443. Rather than fight for the ports,
# that nginx terminates TLS for BOTH sites. Its compose bind-mounts a single
# file — ./nginx/app.conf — so these blocks live INSIDE
# /opt/sga/nginx/app.conf, between the markers:
#
#   # >>> BEGIN go-logistics (managed: deploy/nginx/go-logistics.conf) >>>
#   ...
#   # <<< END go-logistics <<<
#
# Mounting a directory instead would be tidier but forces a container recreate,
# i.e. a visible blip on the other site. Appending + reload does not.
#
# To change the edge config: edit this file, copy the block onto the server
# between the markers, then
#   docker exec sga_nginx nginx -t && docker exec sga_nginx nginx -s reload
#
# The certificate comes from the sga stack's existing certbot container
# (webroot /var/www/certbot), which renews it on the same 12h loop.

server {
    listen 80;
    server_name go-logistics.jesuslab135.com;

    # Must stay reachable over plain HTTP: this is how certbot renews.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name go-logistics.jesuslab135.com;

    ssl_certificate     /etc/letsencrypt/live/go-logistics.jesuslab135.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go-logistics.jesuslab135.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # UPLOAD_MAX_BYTES is 5 MiB; leave headroom for multipart framing.
    client_max_body_size 8M;

    # Docker's embedded DNS, re-resolved every 10s. Without this — and without
    # the variable in proxy_pass that forces the lookup to be per-request —
    # nginx would resolve the upstreams once at config load and then 502 after
    # every deploy, because each release replaces the api container (new IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Public object storage. Stored URLs look like
    #   https://go-logistics.jesuslab135.com/fleet/uploads/<company>/<token>-<name>
    # which is native S3 path style, so the /fleet prefix IS the bucket and
    # passes through untouched. The API has no route under /fleet.
    location /fleet/ {
        set $fleet_minio fleet-minio:9000;
        proxy_pass http://$fleet_minio$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private object storage, the fleet-private bucket. Unlike /fleet/ this
    # bucket carries NO anonymous read policy: only a presigned request with a
    # valid signature succeeds, and everything else gets MinIO's 403. That is
    # the access boundary, not this location block.
    #
    # Host must be passed through unchanged. A SigV4 signature covers the host
    # header, the API signs for this public name (STORAGE_MINIO_SIGNING_ENDPOINT),
    # and if nginx replaced it with the upstream's name MinIO would compute a
    # different signature and reject every URL.
    #
    # Without this block a signed URL falls through to `location /` and the API
    # answers 404, which looks like a missing file rather than a missing route.
    location /fleet-private/ {
        set $fleet_private_minio fleet-minio:9000;
        proxy_pass http://$fleet_private_minio$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $fleet_api fleet-api:8080;
        proxy_pass http://$fleet_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
